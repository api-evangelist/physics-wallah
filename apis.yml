aid: physics-wallah
name: Physics Wallah
description: >-
  Physics Wallah (PW) is India's leading affordable education technology platform, offering
  live and recorded courses, test series, notes, and doubt-solving for competitive exams
  (IIT JEE, NEET, GATE, UPSC), government job preparation (SSC, Banking, Railways, Defence),
  school boards (CBSE, ICSE, and regional boards), and professional certifications (CA, CS,
  CFA, ACCA). Beyond its flagship pw.live learning app it operates PW Skills for professional
  upskilling, PW Store for books and study material, CuriousJr for younger grades, and 100+
  offline Vidyapeeth and Pathshala centres across 175+ cities. Physics Wallah reached unicorn
  status in 2022 and serves tens of millions of students. It was surfaced in the API Evangelist
  network as a portfolio company of Lightspeed Venture Partners. Physics Wallah does not
  publish an official public developer portal or API program; the company's public technology
  footprint is a set of open-source infrastructure libraries under its tech-pw GitHub org.
